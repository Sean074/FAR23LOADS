[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sloads"
version = "0.6.0"
description = "Modern Python/Streamlit replication of the FAR 23 LOADS suite (McMaster) — FAR Part 23 Subpart C structural design loads."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sean O'Meara", email = "sean.c.omeara74@gmail.com"},
]
keywords = ["far23", "aircraft", "structural-loads", "aerospace", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    # Mirrors the CI matrix in .github/workflows/ci.yml -- a classifier claiming
    # less than CI tests understates support; claiming more asserts an untested one.
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "streamlit>=1.36",  # st.navigation(expanded=...) added in 1.36
    "pandas>=2.0",
    "plotly>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist",
    # The two lint/type gates are PINNED (item 8, 2026-08-16): a newer ruff on
    # the CI runner than on the developer's machine turned a green local run
    # into a red PR (RUF068 arrived with 0.16). Bumping either is a deliberate
    # one-line PR whose CI run is the review of the new rules, not a surprise
    # in someone else's PR. Same versions the pre-commit hooks run.
    "ruff==0.16.3",
    # Static type checking of `sloads/` (design note 27, 2026-08-16). A CI gate
    # in default mode at zero errors; strictness ratchets per package through
    # the [[tool.mypy.overrides]] list below. `app/` and `tests/` are not checked.
    # mypy 2.x has no 3.9 wheel; the type gate runs on 3.12 only, so the 3.9
    # leg simply does not install it.
    "mypy==2.3.1; python_version >= '3.10'",
    # Git hooks (item 8): `pre-commit install --hook-type pre-commit --hook-type
    # pre-push` once per clone; ruff + mypy on commit, the suite on push. Opt-in
    # convenience -- CI is the gate.
    "pre-commit",
    # Cyclomatic-complexity / maintainability-index reporting (M4-11, decision
    # D-17). A measurement tool only -- deliberately NOT a CI gate: `ruff` and
    # `pytest` remain the merge gate (see CLAUDE.md). Usage:
    #   .venv/bin/radon cc -s -n C app/views/
    #   .venv/bin/radon mi -s app/views/
    "radon",
]
# The sbeam round-trip gate's solver (decision S-1, design note
# docs/40_history/17_sbeam_roundtrip_ci_harness_plan.md). Deliberately NOT in
# `dev`: `pip install -e '.[dev]'` stays scipy-free and fast for everyone not
# working at the export boundary, and the gate skips when it is absent.
#
# **Pinned by commit, on purpose.** An unrelated sbeam commit must never redden
# an unrelated sloads PR, and bumping the pin is a *claim* that the new sbeam
# still honours the deck contract -- the same posture tests/imperial_baseline.py
# takes about digest regeneration. Bump procedure: PROJECT_GUIDE.md §"sbeam pin".
# The weekly sbeam-drift workflow tracks `main` non-blockingly so drift is
# visible without gating.
solver = [
    "sbeam @ git+https://github.com/Sean074/sbeam.git@ed23b2681feccd9fadfd2e4b829d414094c4b63c",
]

[project.scripts]
sloads = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
# ``app_shell`` is the app-layer shell shared by every sloads GUI (design note 32,
# OG-B). It is a real installed package, not a directory on Streamlit's implicit
# entrypoint path, precisely so a second front-end can import it from its own
# entrypoint without inheriting the first one's sys.path. The GUIs themselves
# (``app/``) stay uninstalled script directories.
include = ["sloads*", "app_shell*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Widened 2026-08-16 (design note 27): pattern-level defect classes beyond the
# pycodestyle/pyflakes floor. `UP` (pyupgrade) is deliberately absent while 3.9
# is in the CI matrix -- its findings are 3.10+ syntax, not defects. `N` stays
# off: single-letter FAR variable names are the porting convention (E741 below).
# `PERF` is off: performance-only, and its two hit classes here are the intentional
# per-module try/except in the registry and loop-vs-comprehension nits.
select = ["E", "F", "W", "B", "SIM", "PLE", "PLW", "ARG", "RUF", "I", "C4"]
ignore = [
    "E741",    # I, L, N, etc. are standard FAR 23 / structural-loads variable names ported from the BASIC source
    "RUF001",  # ambiguous-unicode: the docstrings/labels use →, ±, ×, − deliberately (CONVENTIONS.md glyphs)
    "RUF002",
    "RUF003",
    "RUF005",  # list-literal concatenation reads better than unpacking for the multi-line deck/card builders
    "C408",    # `dict(width=3)` is the plotly/Streamlit keyword idiom throughout app/; not a defect
]

[tool.mypy]
# Design note 27 (2026-08-16). Default mode is the CI gate at zero errors on
# `sloads/`; the overrides below ratchet strictness per package, SSOT owners
# first. Never widen an override to silence an error -- narrow the type.
# No python_version pin: mypy 2.x targets the running interpreter (the CI job
# runs it on 3.12; the code stays 3.9-compatible by the test matrix, not by mypy).
files = ["sloads"]
ignore_missing_imports = true      # streamlit / plotly / openpyxl / sbeam ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
# Ratchet stage 1: the single-source owners are fully typed.
module = [
    "sloads.models.*",
    "sloads.safety_factors",
    "sloads.units",
    "sloads.case_ids",
    "sloads.load_keys",
    "sloads.constants",
    "sloads.registry",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Parallel by default (CH-1): the full suite is minutes instead of ~18 with the
# solver leg. Debugging with `-s`/pdb: pass `-p no:xdist` (or `-n 0`).
# Coverage is CI's concern -- the flags live in ci.yml, not here, so local runs
# skip the instrumentation cost; opt in with `--cov=sloads`.
addopts = "-n auto"
markers = [
    # The sbeam round-trip gate. Selected by its own CI job (`pytest -m roundtrip`,
    # decision S-8) so the failure is named in the PR check list rather than
    # buried in a 900-test run; in the normal matrix these tests skip, because
    # `dev` does not install the solver.
    "roundtrip: needs the real sbeam solver installed (`pip install -e '.[solver]'`)",
]

[tool.coverage.run]
branch = true
source = ["sloads"]

[tool.coverage.report]
show_missing = true
skip_empty = true
