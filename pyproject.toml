[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "sloads"
version = "0.3.0"
description = "Modern Python/Streamlit replication of the FAR 23 LOADS suite (McMaster) — FAR Part 23 Subpart C structural design loads."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sean O'Meara", email = "sean.c.omeara74@gmail.com"},
]
keywords = ["far23", "aircraft", "structural-loads", "aerospace", "streamlit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "streamlit>=1.36",  # st.navigation(expanded=...) added in 1.36
    "pandas>=2.0",
    "plotly>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    # Cyclomatic-complexity / maintainability-index reporting (M4-11, decision
    # D-17). A measurement tool only -- deliberately NOT a CI gate: `ruff` and
    # `pytest` remain the merge gate (see CLAUDE.md). Usage:
    #   .venv/bin/radon cc -s -n C app/views/
    #   .venv/bin/radon mi -s app/views/
    "radon",
]

[project.scripts]
sloads = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sloads*"]

[tool.setuptools]
py-modules = ["cli"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E741",  # I, L, N, etc. are standard FAR 23 / structural-loads variable names ported from the BASIC source
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=sloads --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["sloads"]

[tool.coverage.report]
show_missing = true
skip_empty = true
