name: CI

on:
  push:
    # `dev/**` is the milestone branch of DEVELOPMENT_PROCESS.md §0: every item
    # of a milestone commits straight onto it, and each push runs the fast gate
    # below as an **advisory** signal (the branch is unprotected — nothing waits
    # on it, and it runs while the next item is already being worked). The
    # milestone lands on `main` as one pull request, and that merge push is
    # where the full matrix runs.
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the run the first one started: a
# 10-minute run of a commit nobody will merge is the single largest waste in
# the log (2026-08-17 process review).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The full matrix runs in exactly one place: the push to `main`, which
        # is the milestone merge. Everything else -- every PR, and every push to
        # a `dev/**` milestone branch -- is the fast gate: ONE interpreter
        # (3.12, uninstrumented). The 3.9 / 3.11 legs are the *compatibility*
        # claim, not the correctness gate, and in this repository they have
        # never failed where 3.12 passed; they are fixed forward if they ever
        # differ (2026-08-17 process review; DEVELOPMENT_PROCESS §0). Required
        # checks on `main` are therefore `test (3.12)`, `typecheck`,
        # `sbeam-roundtrip (3.12)`.
        python-version: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["3.9", "3.11", "3.12"]') || fromJSON('["3.12"]') }}
        # Coverage on ONE leg, and on PUSH TO MAIN only (2026-08-16 item 8;
        # moved off the PR leg 2026-08-22): coverage instrumentation was the
        # wall-clock multiplier — the instrumented PR leg had grown past 27
        # minutes against ~2.5 uninstrumented local minutes. The 80 % floor is
        # one number a single item almost never moves; like the 3.9/3.11
        # compatibility legs it is measured on the merge push and fixed forward
        # (DEVELOPMENT_PROCESS §0). Keeping it off `dev/**` is what holds the
        # advisory gate at its measured ~7.3 min instead of ~27.
        include: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('[{"python-version":"3.12","coverage":"--cov=sloads --cov-report=term-missing --cov-fail-under=80"}]') || fromJSON('[]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check sloads/ cli.py oracle.py app/ app_shell/ oracle_app/ scripts/

      - name: Test (pytest)
        env:
          STREAMLIT_SERVER_HEADLESS: "true"
          # The instrumented leg measures with 3.12's `sys.monitoring` core,
          # which is close to free — but it supports LINE coverage only on
          # 3.12/3.13 (branch measurement under sysmon needs 3.14), which is
          # why `[tool.coverage.run]` no longer sets `branch = true`. Inert on
          # the uninstrumented legs and ignored below 3.12.
          COVERAGE_CORE: "sysmon"
        # Coverage lives here, not in `addopts` (CH-1): CI is the enforcement
        # point; local runs stay uninstrumented and fast. `matrix.coverage` is
        # set on the 3.12 leg only (see the matrix `include` above); on the
        # other legs it expands to nothing.
        run: pytest -q --tb=short --durations=15 ${{ matrix.coverage }}

  # Static type check of the calc package (design note 27, 2026-08-16). Its own
  # job, on one interpreter: mypy 2.x targets the running Python and the code's
  # 3.9 compatibility is the test matrix's claim, not mypy's. Zero errors in
  # default mode is the gate; the per-package strictness ratchet lives in
  # pyproject.toml [[tool.mypy.overrides]].
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Type check (mypy)
        run: mypy

  # The sbeam round-trip gate: the exported decks are handed to the real solver
  # and its recovered loads are compared with sloads' own (design note
  # docs/40_history/17_sbeam_roundtrip_ci_harness_plan.md, decisions S-1/S-8).
  #
  # Its own job, not a fourth leg of the matrix above: that keeps `pip install
  # scipy` off the three existing legs, and names the failure ("sbeam round
  # trip") in the PR check list instead of burying it in a 1000-test run. 3.9 is
  # skipped for install cost only -- sbeam's own CI covers it.
  sbeam-roundtrip:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same split as `test`: 3.12 everywhere, 3.11 added on the push to main.
        python-version: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies (with the pinned solver)
        run: |
          pip install --upgrade pip
          pip install -e '.[dev,solver]'

      - name: Round-trip gate
        env:
          # Turns "sbeam is missing" from a skip into a failure. Without this a
          # broken solver install reports green -- the exact failure mode this
          # gate exists to end (decision S-7).
          SLOADS_REQUIRE_SBEAM: "1"
          STREAMLIT_SERVER_HEADLESS: "true"
        # No coverage flags: the --cov-fail-under=80 gate belongs to the full
        # suite, and a marker-selected subset would trip it spuriously.
        run: pytest -m roundtrip -v --tb=short
